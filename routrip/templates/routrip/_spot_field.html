{{ spot_form.spot.errors }}
{{ spot_form.new_spot_name.errors }}


<div class="spot-resolved" hidden>
    <span>📍</span>
    <span class="spot-name"></span>
    <button type="button" class="spot-change">変更</button>
</div>

<div class="spot-status" aria-live="polite"></div>

<div class="place-search" hidden>
  <p class="spot-candidates-note place-search-note"></p>
  <div class="place-search-row">
    <input type="text" class="place-query" placeholder="地名を入力（例：福岡市）" autocomplete="off">
    <button type="button" class="place-search-button">検索</button>
  </div>
  <div class="place-results"></div>
  <button type="button" class="map-open-button">地図で指定する</button>
</div>

<div class="pin-step" hidden>
  <p class="spot-candidates-note pin-note"></p>
  <div class="pin-choice" hidden>
    <button type="button" class="pin-use-existing"></button>
    <button type="button" class="pin-make-new">別の場所として登録する</button>
  </div>
  <div class="pin-name-row" hidden>
    <input type="text" class="pin-name" maxlength="30" placeholder="この場所の名前" autocomplete="off">
    <button type="button" class="pin-name-ok">決定</button>
  </div>
  <p class="pin-error errorlist" hidden></p>
  <button type="button" class="pin-back">← 地図に戻る</button>
</div>
