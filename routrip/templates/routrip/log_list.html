<!--ログ一覧表示エリア-->
<div class="log-list-container">
    {% for log in logs%}
        <div class="log-card">
            <a href="{% url 'routrip:log_detail' log.pk %}" class="log-card-link">
                <div class="log-card-inner">
                    {% if log.thumbnail_card and log.thumbnail_card.image_path %}
                        <div class="log-thumbnail-wrapper">
                            <img src="{{ log.thumbnail_card.image_path.url }}" alt="{{ log.title }}" class="log-thumbnail">
                        </div>
                    {% else %}
                        <!-- 画像がない場合のプレースホルダー（またはデフォルト画像） -->
                        <div class="log-thumbnail-wrapper no-image">
                            <span>No Image</span>
                        </div>
                    {% endif %}
                    <span class="log-title">{{ log.title  }}</span>
                </div>
                </a> 
        </div>
        
    {% empty %}
        <!--空状態の表示メッセージ-->
        <div class="empty-state">
            {% if is_searched %}
            <!--logの中身が空だった場合-->
                <p class="empty-message">該当するログが見つかりませんでした</p>
            {% else %}
            <!--検索結果が０件だった場合-->
                <p class="empty-message">登録されているログがありません</p>
            {% endif %}
        </div>
    {% endfor %}

</div>
